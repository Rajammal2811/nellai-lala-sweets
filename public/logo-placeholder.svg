<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C1527"/>
      <stop offset="100%" stop-color="#380913"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <pattern id="motif" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="#D4AF37" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="392" height="152" rx="12" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="10" y="10" width="380" height="140" rx="8" fill="url(#motif)"/>
  
  <!-- Inner Decorative Border -->
  <rect x="12" y="12" width="376" height="136" rx="7" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>

  <!-- Left Icon Emblem: Diya / Traditional Kalash -->
  <g transform="translate(42, 80)">
    <!-- Aura Glow -->
    <circle cx="0" cy="-6" r="26" fill="#D4AF37" opacity="0.12"/>
    <circle cx="0" cy="-6" r="18" fill="#FCE082" opacity="0.15"/>
    
    <!-- Diya Flame -->
    <path d="M0 -34 C-6 -22, -9 -14, -6 -6 C-3 2, 3 2, 6 -6 C9 -14, 6 -22, 0 -34 Z" fill="url(#goldGrad)"/>
    <path d="M0 -26 C-3 -18, -4 -12, -2 -7 C-1 -2, 1 -2, 2 -7 C4 -12, 3 -18, 0 -26 Z" fill="#FFF9E0"/>
    
    <!-- Diya Base / Sweet Bowl -->
    <path d="M-22 4 C-18 18, 18 18, 22 4 C16 1, -16 1, -22 4 Z" fill="url(#goldGrad)"/>
    <path d="M-10 18 L10 18 L6 25 L-6 25 Z" fill="#D4AF37"/>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(100, 0)">
    <!-- Tamil Name -->
    <text x="140" y="48" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-weight="700" font-size="21" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.5">
      நெல்லை லாலா ஸ்வீட்ஸ்
    </text>

    <!-- English Brand Name -->
    <text x="140" y="77" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      NELLAI LALA SWEETS
    </text>

    <!-- Subtitle / Location -->
    <text x="140" y="100" font-family="sans-serif" font-weight="600" font-size="11" fill="#E2CA70" text-anchor="middle" letter-spacing="3">
      VEDASANDUR • ESTD. TRADITION
    </text>

    <!-- Original Logo Placeholder tag -->
    <rect x="45" y="114" width="190" height="20" rx="10" fill="#28040C" stroke="#D4AF37" stroke-width="0.75" opacity="0.85"/>
    <text x="140" y="128" font-family="sans-serif" font-size="9" font-weight="500" fill="#F4ECC7" text-anchor="middle" letter-spacing="0.5">
      ★ ORIGINAL LOGO PLACEHOLDER ★
    </text>
  </g>
</svg>
